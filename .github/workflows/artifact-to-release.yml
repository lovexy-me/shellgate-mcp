name: Encrypted artifact to temporary release
# Copies the age-encrypted PE images of one pe-build run to a temporary pre-release so the
# maintainer's own machine can fetch them without a GitHub login. The files stay encrypted
# (only the age private key on that machine opens them); delete the release after download.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "pe-build run id"
        required: true
permissions:
  contents: write
  actions: read
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          pattern: shellgate-pe-*-encrypted
          path: dl
      - name: Create temporary pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dl -type f -exec ls -l {} \;
          tag="tmp-pe-${{ inputs.run_id }}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "$tag (encrypted, temporary)" --notes "age-encrypted PE images, temporary; deleted after download." \
            $(find dl -type f)
