name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: openwrt
        run: cargo test --release && cargo build --release
      - run: pip install -e ".[dev]"
      - run: SHELLGATE_BIN=$PWD/openwrt/target/release/shellgate pytest -q tests/test_e2e.py tests/test_ventoy_e2e.py
  rust-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu,i686-pc-windows-gnu
      - run: pip install ziglang cargo-zigbuild
      - working-directory: openwrt
        run: |
          cargo zigbuild --release --target x86_64-pc-windows-gnu
          cargo zigbuild --release --target i686-pc-windows-gnu
