name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches pyproject, __init__ and Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          init=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/shellgate/__init__.py)
          rs=$(sed -n 's/^version = "\(.*\)"/\1/p' openwrt/Cargo.toml | head -1)
          echo "tag=$tag pyproject=$py init=$init cargo=$rs"
          [ "$tag" = "$py" ] && [ "$tag" = "$init" ] && [ "$tag" = "$rs" ]

  python:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" build
      - run: pytest -q
      - run: python -m build --sdist --wheel --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  rust:
    needs: check-version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-musl      # MT7981 (360 T7), MT7986, most ARM64 routers
          - armv7-unknown-linux-musleabihf  # IPQ40xx, MT7629 and other Cortex-A7/A9
          - x86_64-unknown-linux-musl       # x86 soft routers
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: pip install ziglang cargo-zigbuild
      - working-directory: openwrt
        run: cargo test --release
      - working-directory: openwrt
        run: cargo zigbuild --release --target ${{ matrix.target }}
      - run: cp openwrt/target/${{ matrix.target }}/release/shellgate shellgate-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: shellgate-${{ matrix.target }}
          path: shellgate-${{ matrix.target }}

  release:
    needs: [python, rust]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: sha256sum shellgate-* *.whl *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            shellgate-*
            *.whl
            *.tar.gz
            SHA256SUMS
