name: Release OpenWrt binaries
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-musl      # MT7981 (360 T7), MT7986, most ARM64 routers
          - armv7-unknown-linux-musleabihf  # IPQ40xx, MT7629 and other Cortex-A7/A9
          - x86_64-unknown-linux-musl       # x86 soft routers
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: pip install ziglang cargo-zigbuild
      - working-directory: openwrt
        run: cargo zigbuild --release --target ${{ matrix.target }}
      - run: cp openwrt/target/${{ matrix.target }}/release/shellgate shellgate-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: shellgate-${{ matrix.target }}
          path: shellgate-${{ matrix.target }}
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: sha256sum shellgate-* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            shellgate-*
            SHA256SUMS
