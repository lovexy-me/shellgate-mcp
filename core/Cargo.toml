[package]
name = "shellgate"
version = "0.3.0"
edition = "2021"
description = "ShellGate MCP server for OpenWrt / embedded Linux / Windows (Ventoy rescue stick): a single static binary"
license = "MIT"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "1", features = ["rt", "net", "process", "io-util", "time", "sync", "macros", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl", "perf-literal"] }
shlex = "1"
getrandom = "0.2"
socket2 = "0.6"
sha2 = { version = "0.10", default-features = false, features = ["std"], optional = true }
ureq = { version = "2", default-features = false, features = ["tls"], optional = true }
# desktop tools: PNG deflate and JPEG (pure Rust, small)
miniz_oxide = "0.8"
jpeg-encoder = { version = "0.6", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_System_LibraryLoader"] }
# UI Automation (COM) for the desktop tools
windows = { version = "0.62", optional = true, features = ["Win32_UI_Accessibility", "Win32_System_Com", "Win32_Foundation", "Win32_System_Variant", "Win32_System_Ole"] }

[features]
# Building blocks
ventoy = []                              # ventoy_* tools (find / list / config the Ventoy partition)
download = ["ventoy", "dep:ureq", "dep:sha2"]   # ventoy_add over https (rustls + webpki roots, ~1.3 MB)
desktop = ["dep:windows"]                # Windows desktop tools (UIA, screenshot, SendInput); no-op elsewhere
# Editions: one per scenario, each with its own config, docs and release tag (see editions/*/README.md)
edition-openwrt = []                                   # routers: smallest, no ventoy/desktop/https
edition-pe = ["ventoy", "download", "desktop"]         # WinPE / Windows rescue stick
edition-linux = ["ventoy", "download"]                 # WSL2 / Linux hosts, rescue Linux on the stick
# `cargo build` with no flags builds everything (used by the tests)
default = ["ventoy", "download", "desktop"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
