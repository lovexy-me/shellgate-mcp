[package]
name = "shellgate"
version = "0.2.1"
edition = "2021"
description = "ShellGate MCP server for OpenWrt / embedded Linux: a single static binary"
license = "MIT"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "1", features = ["rt", "net", "process", "io-util", "time", "sync", "macros", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl", "perf-literal"] }
shlex = "1"
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
