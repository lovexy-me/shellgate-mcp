[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shellgate-mcp"
version = "0.2.3"
description = "Token-protected MCP server that gives an AI client shell, file and Docker control of a Linux/WSL2 host over Streamable HTTP."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["mcp>=1.12,<2", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
shellgate = "shellgate.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
